version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - auth-service
      - proxy-service
      - admin-service
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: fouter
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fouter123}
      POSTGRES_DB: fouter
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    environment:
      - DATABASE_URL=postgresql://fouter:${DB_PASSWORD:-fouter123}@postgres/fouter
      - REDIS_URL=redis://redis:6379
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - LOG_LEVEL=info
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  rate-limit-service:
    build: ./services/rate-limit-service
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    ports:
      - "8003:8000"
    depends_on:
      - redis
    restart: unless-stopped

  proxy-service:
    build: ./services/proxy-service
    environment:
      - DATABASE_URL=postgresql://fouter:${DB_PASSWORD:-fouter123}@postgres/fouter
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT_SERVICE_URL=http://rate-limit-service:8000
      - LOG_LEVEL=info
    ports:
      - "8002:8000"
    depends_on:
      - postgres
      - redis
      - rate-limit-service
    restart: unless-stopped

  admin-service:
    build: ./services/admin-service
    environment:
      - DATABASE_URL=postgresql://fouter:${DB_PASSWORD:-fouter123}@postgres/fouter
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    ports:
      - "8004:8000"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
