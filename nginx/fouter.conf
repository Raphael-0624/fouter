server {
    listen 8080;
    server_name localhost;

    # Frontend - React SPA
    location /fouter/ {
        alias /usr/share/nginx/html/fouter/;
        try_files $uri $uri/ /fouter/index.html;
    }

    # API Routes - Auth Service
    location /fouter-api/auth/ {
        proxy_pass http://127.0.0.1:8001/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API Routes - Admin Service
    location /fouter-api/admin/ {
        proxy_pass http://127.0.0.1:8004/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy service - OpenAI format
    location /fouter-api/v1/openai/ {
        proxy_pass http://127.0.0.1:8002/v1/openai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Proxy service - Anthropic format
    location /fouter-api/v1/anthropic/ {
        proxy_pass http://127.0.0.1:8002/v1/anthropic/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Health check
    location /fouter-api/health {
        return 200 "healthy\n";
    }
}
